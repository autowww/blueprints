<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Test automation framework four-tier taxonomy</title>
  <desc id="desc">Stacked tiers from unit and component frameworks at the base through API, E2E UI, and AI-augmented testing at the top.</desc>
  <text x="360" y="22" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#06B6D4">Test automation framework taxonomy</text>
  <g font-family="system-ui, sans-serif" font-size="11">
    <rect x="40" y="40" width="640" height="52" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="56" y="62" fill="#F59E0B" font-weight="700">4. AI-augmented testing</text>
    <text x="56" y="78" fill="#94a3b8" font-size="10">Playwright Agents  |  Mabl  |  testRigor  |  Katalon  |  Applitools</text>
    <rect x="40" y="102" width="640" height="52" rx="6" fill="#1e3a5f" stroke="#334155"/>
    <text x="56" y="124" fill="#06B6D4" font-weight="700">3. E2E / UI frameworks</text>
    <text x="56" y="140" fill="#cbd5e1" font-size="10">Playwright  |  Cypress  |  Selenium  |  Espresso  |  Appium</text>
    <rect x="40" y="164" width="640" height="52" rx="6" fill="#1e3a5f" stroke="#334155"/>
    <text x="56" y="186" fill="#06B6D4" font-weight="700">2. API / contract frameworks</text>
    <text x="56" y="202" fill="#cbd5e1" font-size="10">Pact  |  REST Assured  |  Postman/Newman  |  Karate  |  Supertest</text>
    <rect x="40" y="226" width="640" height="52" rx="6" fill="#1e3a5f" stroke="#334155"/>
    <text x="56" y="248" fill="#06B6D4" font-weight="700">1. Unit / component frameworks</text>
    <text x="56" y="264" fill="#cbd5e1" font-size="10">JUnit  |  pytest  |  Jest  |  XCTest  |  go test  |  Vitest</text>
  </g>
</svg>
