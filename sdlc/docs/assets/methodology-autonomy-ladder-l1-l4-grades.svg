<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Forge autonomy ladder L0 to L8 with maturity grades a-d and L1-L4 sub-level bands</title>
  <desc id="desc">A rising staircase of autonomy levels L0 through L8. L0 through L3 are defined and exercised today with sub-level bands L1.1 through L3.4. L4 through L8 are vision requiring extra gates. Maturity grades a Defined, b Demonstrated, c Repeatable, d Operational apply to every level. L1.1b, L1.2b, L2.2b, and L3.1b are demonstrated today.</desc>
  <rect width="100%" height="100%" fill="none"/>
  <text x="450" y="18" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="700" font-size="12" fill="#06B6D4">Autonomy ladder  levels, sub-levels (L1.1L4.3), and maturity grades (ad)</text>
  <g font-family="system-ui, sans-serif">
    <!-- L0 -->
    <rect x="8" y="200" width="56" height="24" rx="3" fill="#1e3a5f" stroke="#06B6D4" stroke-width="1"/>
    <text x="36" y="214" text-anchor="middle" fill="#fff" font-weight="700" font-size="9">L0</text>
    <text x="36" y="236" text-anchor="middle" fill="#94a3b8" font-size="6.5">Assisted</text>
    <!-- L1 -->
    <rect x="72" y="168" width="56" height="56" rx="3" fill="#1e3a5f" stroke="#06B6D4" stroke-width="1"/>
    <text x="100" y="184" text-anchor="middle" fill="#fff" font-weight="700" font-size="9">L1</text>
    <text x="100" y="196" text-anchor="middle" fill="#e0f2fe" font-size="6.5">Function</text>
    <rect x="76" y="206" width="16" height="10" rx="1" fill="#0e7490" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="84" y="213" text-anchor="middle" fill="#fde68a" font-size="5" font-weight="700">1.1b</text>
    <rect x="94" y="206" width="16" height="10" rx="1" fill="#0e7490" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="102" y="213" text-anchor="middle" fill="#fde68a" font-size="5" font-weight="700">1.2b</text>
    <rect x="112" y="206" width="12" height="10" rx="1" fill="#0e7490" stroke="#06B6D4" stroke-width="0.5"/>
    <text x="118" y="213" text-anchor="middle" fill="#e0f2fe" font-size="5">1.3</text>
    <!-- L2 -->
    <rect x="136" y="136" width="56" height="88" rx="3" fill="#1e3a5f" stroke="#06B6D4" stroke-width="1"/>
    <text x="164" y="152" text-anchor="middle" fill="#fff" font-weight="700" font-size="9">L2</text>
    <text x="164" y="164" text-anchor="middle" fill="#e0f2fe" font-size="6.5">Change-set</text>
    <rect x="140" y="206" width="16" height="10" rx="1" fill="#0e7490" stroke="#06B6D4" stroke-width="0.5"/>
    <text x="148" y="213" text-anchor="middle" fill="#e0f2fe" font-size="5">2.1</text>
    <rect x="158" y="206" width="16" height="10" rx="1" fill="#0e7490" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="166" y="213" text-anchor="middle" fill="#fde68a" font-size="5" font-weight="700">2.2b</text>
    <rect x="176" y="206" width="12" height="10" rx="1" fill="#0e7490" stroke="#06B6D4" stroke-width="0.5"/>
    <text x="182" y="213" text-anchor="middle" fill="#e0f2fe" font-size="5">2.3</text>
    <!-- L3 -->
    <rect x="200" y="104" width="56" height="120" rx="3" fill="#1e3a5f" stroke="#06B6D4" stroke-width="1"/>
    <text x="228" y="120" text-anchor="middle" fill="#fff" font-weight="700" font-size="9">L3</text>
    <text x="228" y="132" text-anchor="middle" fill="#e0f2fe" font-size="6.5">Use-case</text>
    <text x="228" y="142" text-anchor="middle" fill="#e0f2fe" font-size="6.5">slice</text>
    <rect x="204" y="206" width="12" height="10" rx="1" fill="#0e7490" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="210" y="213" text-anchor="middle" fill="#fde68a" font-size="5" font-weight="700">3.1b</text>
    <rect x="218" y="206" width="12" height="10" rx="1" fill="#0e7490" stroke="#06B6D4" stroke-width="0.5"/>
    <text x="224" y="213" text-anchor="middle" fill="#e0f2fe" font-size="5">3.2</text>
    <rect x="232" y="206" width="10" height="10" rx="1" fill="#0e7490" stroke="#06B6D4" stroke-width="0.5"/>
    <text x="237" y="213" text-anchor="middle" fill="#e0f2fe" font-size="4.5">3.3</text>
    <rect x="244" y="206" width="10" height="10" rx="1" fill="#0e7490" stroke="#06B6D4" stroke-width="0.5"/>
    <text x="249" y="213" text-anchor="middle" fill="#e0f2fe" font-size="4.5">3.4</text>
    <!-- L4 -->
    <rect x="264" y="148" width="56" height="76" rx="3" fill="#1e293b" fill-opacity="0.55" stroke="#475569" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="292" y="164" text-anchor="middle" fill="#94a3b8" font-weight="700" font-size="9">L4</text>
    <text x="292" y="176" text-anchor="middle" fill="#64748b" font-size="6.5">Feature</text>
    <rect x="268" y="206" width="14" height="10" rx="1" fill="#334155" stroke="#475569" stroke-width="0.5"/>
    <text x="275" y="213" text-anchor="middle" fill="#64748b" font-size="5">4.1</text>
    <rect x="284" y="206" width="14" height="10" rx="1" fill="#334155" stroke="#475569" stroke-width="0.5"/>
    <text x="291" y="213" text-anchor="middle" fill="#64748b" font-size="5">4.2</text>
    <rect x="300" y="206" width="14" height="10" rx="1" fill="#334155" stroke="#475569" stroke-width="0.5"/>
    <text x="307" y="213" text-anchor="middle" fill="#64748b" font-size="5">4.3</text>
    <!-- L5-L8 vision -->
    <rect x="328" y="128" width="56" height="96" rx="3" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="356" y="146" text-anchor="middle" fill="#94a3b8" font-weight="700" font-size="9">L5</text>
    <text x="356" y="158" text-anchor="middle" fill="#64748b" font-size="6.5">Subsystem</text>
    <rect x="392" y="108" width="56" height="116" rx="3" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="420" y="126" text-anchor="middle" fill="#94a3b8" font-weight="700" font-size="9">L6</text>
    <text x="420" y="138" text-anchor="middle" fill="#64748b" font-size="6.5">Product</text>
    <rect x="456" y="88" width="56" height="136" rx="3" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="484" y="106" text-anchor="middle" fill="#94a3b8" font-weight="700" font-size="9">L7</text>
    <text x="484" y="118" text-anchor="middle" fill="#64748b" font-size="6.5">Multi-cloud</text>
    <rect x="520" y="68" width="56" height="156" rx="3" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="548" y="86" text-anchor="middle" fill="#94a3b8" font-weight="700" font-size="9">L8</text>
    <text x="548" y="98" text-anchor="middle" fill="#64748b" font-size="6.5">Autonomous</text>
    <!-- Grade axis -->
    <rect x="620" y="48" width="260" height="200" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="750" y="66" text-anchor="middle" fill="#06B6D4" font-weight="700" font-size="10">Maturity grades (ad)</text>
    <text x="636" y="92" fill="#94a3b8" font-size="8.5">a  Defined (policy row documented)</text>
    <text x="636" y="114" fill="#f59e0b" font-size="8.5" font-weight="700">b  Demonstrated (one green assay run)</text>
    <text x="636" y="136" fill="#94a3b8" font-size="8.5">c  Repeatable (e5 green runs, escalation &lt; 40%)</text>
    <text x="636" y="158" fill="#94a3b8" font-size="8.5">d  Operational (30-day trend + review sampling)</text>
    <text x="636" y="186" fill="#64748b" font-size="7.5">Notation: L2.2c in forge-lenses</text>
    <text x="636" y="200" fill="#64748b" font-size="7.5">= cross-file defect, repeatable, scoped</text>
    <text x="636" y="228" fill="#f59e0b" font-size="7.5" font-weight="700">Demonstrated today: L1.1b, L1.2b, L2.2b, L3.1b</text>
  </g>
  <line x1="260" y1="36" x2="260" y2="230" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="134" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#06B6D4">defined and exercised (L0L3)</text>
  <text x="434" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#f59e0b">vision  extra gates (L4L8)</text>
  <text x="450" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#708090">Higher levels add gates and never remove lower-level gates. Sub-level assays enforce distinct evidence within the L1L4 band.</text>
</svg>
